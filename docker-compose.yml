# Un solo puerto público. Las bases y Redis permanecen en la red de Compose.
x-entorno-django: &entorno-django
  DJANGO_DEBUG: "0"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defina DJANGO_SECRET_KEY en .env}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1},django
  DJANGO_TRAS_GATEWAY: "1"
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
  TOKEN_SERVICIO_PAGOS: ${TOKEN_SERVICIO_PAGOS:?Defina TOKEN_SERVICIO_PAGOS en .env}
  DB_ENGINE: postgres
  DB_NAME: casalista
  DB_USER: casalista
  DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
  DB_HOST: db
  DB_PORT: "5432"
  URL_PAGOS: /api/v2/pagos/
  NOTIFICADOR_TYPE: ASYNC
  CELERY_BROKER_URL: redis://redis:6379/0
  DJANGO_EMAIL_BACKEND: ${DJANGO_EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@casalista.co}
  EMAIL_HOST: ${EMAIL_HOST:-localhost}
  EMAIL_PORT: ${EMAIL_PORT:-25}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-0}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: casalista
      POSTGRES_USER: casalista
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casalista -d casalista"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - datos_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  django:
    build: .
    restart: unless-stopped
    environment: *entorno-django
    volumes:
      - estaticos:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Host "django" porque Compose siempre lo agrega a ALLOWED_HOSTS: asi el
      # chequeo no depende de que .env incluya localhost (en AWS solo va la IP).
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/api/v1/salud/', headers={'Host': 'django'}), timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  worker:
    build: .
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *entorno-django
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment: *entorno-django
    depends_on:
      django:
        condition: service_healthy
      redis:
        condition: service_healthy

  pagos:
    build: ./servicio_pagos
    restart: unless-stopped
    environment:
      TOKEN_SERVICIO_PAGOS: ${TOKEN_SERVICIO_PAGOS:?Defina TOKEN_SERVICIO_PAGOS en .env}
      # Genere DB_PASSWORD con scripts/preparar_entorno.py (hexadecimal, URL-safe).
      DATABASE_URL: postgresql+psycopg://casalista:${DB_PASSWORD:?Defina DB_PASSWORD en .env}@db:5432/casalista_pagos
      URL_RESERVAS: http://django:8000
      PASARELA_PAGO_TYPE: SIMULADA
    depends_on:
      db:
        condition: service_healthy
      django:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/v2/pagos/salud/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - estaticos:/static:ro
    depends_on:
      django:
        condition: service_healthy
      pagos:
        condition: service_healthy

volumes:
  datos_postgres:
  datos_redis:
  estaticos:
