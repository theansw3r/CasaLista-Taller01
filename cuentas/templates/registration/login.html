{% extends "base.html" %}
{% block title %}Iniciar sesion{% endblock %}
{% block content %}
{% if form.errors %}
<p>Usuario o contrasena incorrectos. Intenta de nuevo.</p>
{% endif %}
<form method="post" action="{% url 'cuentas:login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Iniciar sesion</button>
    <input type="hidden" name="next" value="{% url 'portal:inicio' %}">
</form>
{% endblock %}
