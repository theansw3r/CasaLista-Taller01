[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
# E/W: estilo PEP 8, F: errores reales (imports sin uso, nombres indefinidos),
# I: orden de imports, B: trampas comunes, UP: sintaxis moderna de Python.
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "E501",  # el largo de linea lo resuelve el formateador
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "pagos"]

[tool.ruff.lint.per-file-ignores]
# En pruebas se vale assertRaises(Exception) para simular fallos genericos.
"**/tests/**" = ["B017"]
