name: Validar CasaLista
on:
  push:
    branches: [main, 'entrega2/**']
  pull_request:
    branches: [main]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt -r servicio_pagos/requirements-dev.txt
      - run: python scripts/catalogos.py
      - run: git diff --exit-code -- locale servicio_pagos/locale
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --verbosity 1
      - run: python -m pytest servicio_pagos -q
      - run: python scripts/preparar_entorno.py
      - run: docker compose config --quiet
      - run: docker compose build
