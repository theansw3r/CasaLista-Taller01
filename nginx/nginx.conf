# Unica puerta de entrada de CasaLista.
# Nginx no sabe nada del negocio: solo mira el comienzo de la URL y decide a
# que servicio mandar la peticion.

upstream django_web {
    server django:8000;
}

upstream flask_pagos {
    server pagos:5000;
}

# Si el cliente ya trae un X-Request-ID se respeta; si no, Nginx genera uno.
map $http_x_request_id $id_peticion {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $id_peticion;

    # Microservicio nuevo: la funcionalidad estrangulada.
    location /api/v2/pagos/ {
        proxy_pass http://flask_pagos;
        proxy_read_timeout 30s;
    }

    # Solo para llamadas entre servicios (Flask -> Django). Desde afuera no existe.
    location /interno/ {
        default_type application/json;
        return 404 '{"error": {"codigo": "HTTP-404", "mensaje": "No encontrado."}}';
    }

    # css y js del front. collectstatic los deja en el volumen compartido.
    location /static/ {
        alias /static/;
    }

    # Monolito legacy: /api/v1/, /admin/, la interfaz y todo lo demas.
    location / {
        proxy_pass http://django_web;
    }

    # Si un servicio esta caido, igual se responde JSON y no la pagina de Nginx.
    error_page 502 503 504 = @servicio_caido;
    location @servicio_caido {
        default_type application/json;
        return 503 '{"error": {"codigo": "HTTP-503", "mensaje": "El servicio no esta disponible en este momento."}}';
    }
}
